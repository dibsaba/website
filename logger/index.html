<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABA Clinical Session Logger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* (Keep your exact CSS styles from previous index.html here to save space) */
        :root { --font-sans: 'Inter', sans-serif; --font-serif: 'Playfair Display', serif; --brand-primary: #292524; --brand-primary-dark: #1c1917; --brand-accent: #ea580c; --brand-accent-light: #fb923c; --brand-accent-dark: #c2410c; --brand-cream: #fff7ed; --brand-sand: #f5f5f4; --brand-surface: #ffffff; --brand-danger: #ef4444; --brand-success: #16a34a; --text-body: #475569; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background-color: var(--brand-cream); color: var(--text-body); -webkit-font-smoothing: antialiased; }
        h1, h2, h3 { font-family: var(--font-serif); color: var(--brand-primary); }
        button { font-family: var(--font-sans); font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--brand-accent); color: #fff; padding: 12px 20px; border-radius: 8px; width: 100%; }
        .btn-primary:disabled { background: var(--text-muted); cursor: not-allowed; }
        .btn-secondary { background: var(--brand-primary); color: #fff; padding: 12px 16px; border-radius: 8px; width:100%; }
        .btn-secondary:disabled { background: var(--text-muted); opacity: 0.5; }
        input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 12px; border: 1px solid var(--text-muted); border-radius: 8px; font-family: var(--font-sans); }
        .view { display: none; min-height: 100vh; }
        .view.active { display: flex; flex-direction: column; }
        #auth-view { justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: #fff; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; width: 100%; }
        #dashboard-view { padding-bottom: 150px; }
        .app-header { background: #fff; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 10; display:flex; justify-content: space-between;}
        .timeline-container { max-width: 800px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .timeline-card { background: #fff; padding: 20px; border-radius: 12px; border-left: 4px solid var(--brand-primary); }
        .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 15px; display: flex; flex-direction: column; gap: 10px; align-items: center; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
        .action-bar-row { max-width: 800px; width: 100%; display: flex; gap: 10px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; width: 100%; max-width: 600px; max-height: 85vh; border-radius: 12px; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--brand-sand); display: flex; justify-content: space-between; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 20px; border-top: 1px solid var(--brand-sand); }
        .form-field { margin-bottom: 20px; }
        .form-label { font-weight: 600; display: block; margin-bottom: 8px; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .checkbox-pill input { display: none; }
        .checkbox-pill span { padding: 10px; background: var(--brand-sand); border-radius: 8px; display: inline-block; cursor: pointer; }
        .checkbox-pill input:checked + span { background: var(--brand-accent); color: #fff; }
    </style>
</head>
<body>
    <div id="auth-view" class="view active">
        <div class="auth-card">
            <h1>ABA Logger</h1>
            <div style="margin-bottom:20px;"><input type="password" id="password-input" placeholder="Password"></div>
            <button id="btn-login" class="btn-primary">Unlock</button>
            <p id="auth-error" style="color:red; display:none; margin-top:10px;">Incorrect</p>
        </div>
    </div>

    <div id="dashboard-view" class="view">
        <header class="app-header"><h2>Session Timeline</h2><button id="btn-clear" style="background:none; color:red; border:none; cursor:pointer;">Clear</button></header>
        <main class="timeline-container" id="timeline-feed"></main>
        
        <nav class="action-bar">
            <div class="action-bar-row"><button id="btn-start" class="btn-primary" style="background:var(--brand-success);">Start Session</button></div>
            <div class="action-bar-row">
                <button id="btn-skill" class="btn-secondary" disabled>Add Skill</button>
                <button id="btn-behavior" class="btn-secondary" disabled>Add Behavior</button>
                <button id="btn-transition" class="btn-secondary" disabled>Transition</button>
                <button id="btn-end" class="btn-secondary" disabled>End Session</button>
            </div>
            <div class="action-bar-row"><button id="btn-generate" class="btn-primary" disabled>Generate Note</button></div>
        </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div id="form-modal" class="modal" style="display:none;">
            <header class="modal-header"><h2 id="form-title">Event</h2><button class="close-btn" data-close>X</button></header>
            <div class="modal-body" id="form-container"></div>
            <footer class="modal-footer"><button id="btn-save" class="btn-primary">Save</button></footer>
        </div>
        <div id="generate-modal" class="modal" style="display:none;">
            <header class="modal-header"><h2>Generated Note</h2><button class="close-btn" data-close>X</button></header>
            <div class="modal-body"><textarea id="note-output" rows="12" readonly></textarea></div>
            <footer class="modal-footer"><button id="btn-copy" class="btn-primary">Copy</button></footer>
        </div>
    </div>

    <script type="module">
        import GuardrailEngine from './guardrail_engine.js';
        import SessionNormalizer from './session_normalizer.js';
        import NarrativePlanner from './narrative_planner.js';
        import NarrativeEngine from './narrative_engine.js';

        const EXPECTED_HASH = "8ec0a38b1968ed925ef5b871cda95baefd8cdcdbc34a81ba0bba80b62e4f0d3b";
        let timeline = JSON.parse(localStorage.getItem('aba_tl')) ||[];
        let schemaData, synonymsData, templatesData, guardrails;
        let currentType = null;

        const UI_CONFIG = {
            Session_Start:[{id:"Location", label:"Location", type:"select"}, {id:"Specific_Setting", label:"Setting", type:"select"}, {id:"Others_Present", label:"Others", type:"multichoice"}, {id:"Initial_Presentation", label:"Presentation", type:"multichoice"}, {id:"Health_Variables", label:"Health", type:"multichoice"}],
            Location_Transition:[{id:"Specific_Setting", label:"New Area", type:"select"}],
            Skill_Acquisition:[{id:"Skill_Domains", label:"Domain", type:"select"}, {id:"Specific_Target", label:"Target (Optional)", type:"text"}, {id:"Teaching_Formats", label:"Format", type:"select"}, {id:"Prompt_Levels", label:"Prompt", type:"select"}, {id:"Reinforcement_Schedules", label:"Schedule", type:"select"}, {id:"Specific_Reinforcers", label:"Reinforcer", type:"multichoice"}],
            Behavior_Reduction:[{id:"Target_Behaviors", label:"Behavior", type:"select"}, {id:"Intensity", label:"Intensity", type:"select"}, {id:"Antecedents", label:"Antecedent", type:"select"}, {id:"Interventions", label:"Interventions", type:"multichoice"}, {id:"Deescalation_Time", label:"Time", type:"select"}],
            Session_End:[{id:"End_Demeanor", label:"Demeanor", type:"select"}, {id:"Caregiver_Handoff", label:"Handoff", type:"multichoice"}]
        };

        async function hashPassword(p) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('btn-login').onclick = async () => {
            if (await hashPassword(document.getElementById('password-input').value) === EXPECTED_HASH) {
                document.getElementById('auth-view').classList.remove('active');
                document.getElementById('dashboard-view').classList.add('active');
                try {
                    const[sch, syn, tpl, grd] = await Promise.all([fetch('schema.json'), fetch('synonyms.json'), fetch('templates.json'), fetch('guardrails.json')]);
                    schemaData = await sch.json();
                    guardrails = new GuardrailEngine(await grd.json());
                    synonymsData = (await syn.json()).Synonyms || await syn.json();
                    templatesData = (await tpl.json()).Templates || await tpl.json();
                    renderTimeline();
                } catch(e) { alert("Error loading files."); }
            } else document.getElementById('auth-error').style.display = 'block';
        };

        const closeModals = () => document.getElementById('modal-overlay').classList.remove('active');
        document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModals);

        const openForm = (type) => {
            currentType = type;
            document.getElementById('form-title').innerText = type.replace('_', ' ');
            const c = document.getElementById('form-container'); c.innerHTML = '';
            
            UI_CONFIG[type].forEach(f => {
                const w = document.createElement('div'); w.className = 'form-field';
                w.innerHTML = `<label class="form-label">${f.label}</label>`;
                if(f.type === 'text') w.innerHTML += `<input type="text" data-id="${f.id}">`;
                else if(f.type === 'select') {
                    let sel = `<select data-id="${f.id}">`;
                    (schemaData[f.id]||[]).forEach(o => sel += `<option value="${o}">${o}</option>`);
                    w.innerHTML += sel + `</select>`;
                } else {
                    let grp = `<div class="checkbox-group" data-id="${f.id}">`;
                    (schemaData[f.id]||[]).forEach(o => grp += `<label class="checkbox-pill"><input type="checkbox" value="${o}"><span>${o}</span></label>`);
                    w.innerHTML += grp + `</div>`;
                }
                c.appendChild(w);
            });

            if (type === 'Behavior_Reduction') setupGuardrails(c);
            
            document.getElementById('form-modal').style.display = 'flex';
            document.getElementById('generate-modal').style.display = 'none';
            document.getElementById('modal-overlay').classList.add('active');
        };

        function setupGuardrails(container) {
            const ant = container.querySelector('select[data-id="Antecedents"]');
            const ints = container.querySelector('.checkbox-group[data-id="Interventions"]');
            const btn = document.createElement('button'); btn.className='btn-secondary'; btn.innerText='Show All Allowable'; btn.style.marginTop='10px';
            let ovr = false; ints.parentNode.appendChild(btn);

            const apply = () => {
                const rules = guardrails.getRulesForAntecedent(ant.value);
                ints.querySelectorAll('.checkbox-pill').forEach(p => {
                    const v = p.querySelector('input').value;
                    if(rules.blacklisted_interventions.includes(v)) { p.style.display='none'; p.querySelector('input').checked=false; }
                    else if(rules.whitelisted_interventions.includes(v)) p.style.display='inline-block';
                    else { p.style.display = ovr ? 'inline-block' : 'none'; if(!ovr) p.querySelector('input').checked=false; }
                });
            };
            ant.onchange = () => { ovr=false; btn.innerText='Show All Allowable'; apply(); };
            btn.onclick = () => { ovr=!ovr; btn.innerText=ovr?'Hide Non-Whitelisted':'Show All Allowable'; apply(); };
            apply();
        }

        document.getElementById('btn-start').onclick = () => openForm('Session_Start');
        document.getElementById('btn-skill').onclick = () => openForm('Skill_Acquisition');
        document.getElementById('btn-behavior').onclick = () => openForm('Behavior_Reduction');
        document.getElementById('btn-transition').onclick = () => openForm('Location_Transition');
        document.getElementById('btn-end').onclick = () => openForm('Session_End');

        document.getElementById('btn-save').onclick = () => {
            const data = {};
            document.getElementById('form-container').querySelectorAll('[data-id]').forEach(el => {
                if(el.tagName === 'SELECT' || el.tagName === 'INPUT') data[el.dataset.id] = el.value;
                else { const c = Array.from(el.querySelectorAll('input:checked')).map(i=>i.value); data[el.dataset.id] = c.length?c:["None selected"]; }
            });
            timeline.push({ type: currentType, timestamp: new Date().toISOString(), data });
            localStorage.setItem('aba_tl', JSON.stringify(timeline));
            renderTimeline(); closeModals();
        };

        function renderTimeline() {
            const f = document.getElementById('timeline-feed'); f.innerHTML = '';
            const started = timeline.some(t => t.type === 'Session_Start');
            const ended = timeline.some(t => t.type === 'Session_End');
            
            document.getElementById('btn-start').style.display = started ? 'none' : 'block';['btn-skill', 'btn-behavior', 'btn-transition', 'btn-end'].forEach(id => document.getElementById(id).disabled = !started || ended);
            document.getElementById('btn-generate').disabled = timeline.length === 0;

            [...timeline].sort((a,b) => new Date(a.timestamp)-new Date(b.timestamp)).forEach(ev => {
                const d = document.createElement('div'); d.className = `timeline-card`;
                d.innerHTML = `<div class="card-header"><strong>${ev.type.replace('_',' ')}</strong></div>`;
                f.prepend(d);
            });
        }

        document.getElementById('btn-generate').onclick = () => {
            // PIPELINE ARCHITECTURE ACTIVATED HERE
            const sortedTimeline = [...timeline].sort((a,b) => new Date(a.timestamp)-new Date(b.timestamp));
            const sessionObj = SessionNormalizer.normalize(sortedTimeline);
            const plan = NarrativePlanner.buildPlan(sessionObj);
            const note = NarrativeEngine.generate(synonymsData, templatesData, plan);
            
            document.getElementById('note-output').value = note;
            document.getElementById('form-modal').style.display = 'none';
            document.getElementById('generate-modal').style.display = 'flex';
            document.getElementById('modal-overlay').classList.add('active');
        };

        document.getElementById('btn-copy').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('note-output').value);
            document.getElementById('btn-copy').innerText = "Copied!";
            setTimeout(() => document.getElementById('btn-copy').innerText = "Copy", 2000);
        };
        document.getElementById('btn-clear').onclick = () => { if(confirm("Clear session?")) { timeline=[]; localStorage.removeItem('aba_tl'); renderTimeline(); } };
    </script>
</body>
</html>
